<!DOCTYPE html>
<html class="no-js" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>LightPayment</title>
    <meta name="description" content="LightPayment cloud POS" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="/content/images/lightpayment-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webapp" />
    <link rel="stylesheet" href="/content/css/loading.css" />
    <meta name="theme-color" content="#000000" />
    <link
      id="theme-link"
      href="/content/theme/theme-light/indigo/theme.css"
      rel="stylesheet"
    />
    <script src="/env-config.js"></script>

    <!-- jhipster-needle-add-resources-to-root - JHipster will add new resources here -->
  </head>
  <body>
    <!--[if lt IE 9]>
      <p class="browserupgrade">
        You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve
        your experience.
      </p>
    <![endif]-->
    <div id="root">
      <div>
        <div class="logo-spinner"></div>
        <div class="logo-image">
          <img src="./content/images/lightpayment-mark.svg" alt="Loading" />
        </div>
        <div class="loading-slogan">
          <p>Brewing the Perfect POS Experience for You ...</p>
        </div>
      </div>

      <div class="app-loading">
        <div id="app-load-slow" style="display: none">
          <p style="margin: 0 0 0.75rem; color: #3f72af; font-size: 0.95rem; font-weight: 600">
            Still loading — this can take a while on a slow connection.
          </p>
          <button
            type="button"
            id="app-load-reload"
            style="
              cursor: pointer;
              border: 1px solid #3f72af;
              background: #fff;
              color: #3f72af;
              border-radius: 0.375rem;
              padding: 0.4rem 0.9rem;
              font-size: 0.85rem;
              font-weight: 600;
            "
          >
            Reload page
          </button>
        </div>
      </div>
    </div>
    <noscript>
      <h1>You must enable JavaScript to view this page.</h1>
    </noscript>
    <script type="text/javascript">
      // Keep the splash visible on slow networks. Only after a long wait offer reload —
      // never show the old JHipster developer troubleshooting page in production.
      (function () {
        var SLOW_LOAD_MS = 20000;
        var slowTimer = null;

        function rootStillBootstrapping() {
          var root = document.getElementById('root');
          return !!(root && root.querySelector('.logo-spinner, .loading-slogan, #app-load-slow'));
        }

        function showSlowLoadHelp() {
          if (!rootStillBootstrapping()) {
            return;
          }
          var slowElm = document.getElementById('app-load-slow');
          if (slowElm && slowElm.style) {
            slowElm.style.display = 'block';
          }
        }

        window.addEventListener('load', function () {
          slowTimer = setTimeout(showSlowLoadHelp, SLOW_LOAD_MS);
        });

        var reloadBtn = document.getElementById('app-load-reload');
        if (reloadBtn) {
          reloadBtn.addEventListener('click', function () {
            window.location.reload();
          });
        }

        // If React mounts and replaces #root, cancel the timer.
        var root = document.getElementById('root');
        if (root && typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function () {
            if (!rootStillBootstrapping()) {
              if (slowTimer) {
                clearTimeout(slowTimer);
                slowTimer = null;
              }
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }
      })();
    </script>

  </body>
</html>
